<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marks Entry - Sanskaar ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="app-shell">
    <div id="page-content">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="nav_marks_entry">Subject Marks Entry Console</h1>
          <p class="text-xs text-slate-500 mt-1">Kathmandu Valley Secondary School • NEB 75 Theory + 25 Practical Mark Evaluation</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="saveMarks()" class="px-4 py-2 text-xs font-bold bg-[#E8752F] text-white rounded-xl hover:bg-[#D46320] transition-colors shadow-sm flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>Save & Compile GPAs</span>
          </button>
        </div>
      </div>

      <!-- Subject & Exam Selectors -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-2xs mb-6 flex flex-wrap items-center gap-3 text-xs">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Examination Cycle</label>
          <select class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none">
            <option selected>Term 1 Terminal Examination 2083</option>
            <option>SEE Pre-Board Model Exam 2083</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Class & Section</label>
          <select class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none">
            <option selected>Class 10 - Section A</option>
            <option>Class 10 - Section B</option>
            <option>Class 10 - Section C</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Curriculum Subject</label>
          <select class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-[#E8752F] focus:outline-none">
            <option selected>Compulsory Mathematics (Code: 003)</option>
            <option>Science & Technology (Code: 004)</option>
            <option>Compulsory English (Code: 001)</option>
            <option>Compulsory Nepali (Code: 002)</option>
            <option>Social Studies (Code: 005)</option>
          </select>
        </div>
        <div class="ml-auto text-right">
          <span class="text-[10px] text-slate-400 block font-bold uppercase">Standard Weightage</span>
          <span class="font-bold text-slate-800">Theory: 75 Marks | Practical: 25 Marks</span>
        </div>
      </div>

      <!-- Marks Entry Table -->
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-2xs overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200/80">
              <tr>
                <th class="py-3 px-4 font-semibold w-16">Roll #</th>
                <th class="py-3 px-4 font-semibold">Student Name</th>
                <th class="py-3 px-3 font-semibold">NEB Symbol No.</th>
                <th class="py-3 px-3 font-semibold text-center w-32">Theory (Max 75)</th>
                <th class="py-3 px-3 font-semibold text-center w-32">Practical (Max 25)</th>
                <th class="py-3 px-3 font-semibold text-center w-28">Total (Max 100)</th>
                <th class="py-3 px-3 font-semibold text-center w-24">Grade Point</th>
                <th class="py-3 px-4 font-semibold text-center w-24">Grade</th>
              </tr>
            </thead>
            <tbody id="marks-entry-tbody" class="divide-y divide-slate-100 font-mono">
              <!-- Dynamically populated rows with live calculation -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="../data/translations.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../assets/js/language.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/modal.js"></script>
  <script src="../assets/js/components.js"></script>

  <script>
    const sampleStudents = [
      { id: 'STU-001', roll: '01', name: 'Aarav Shrestha', symbol: '27014001A', th: 72, pr: 25 },
      { id: 'STU-002', roll: '02', name: 'Bimlesh Adhikari', symbol: '27014002A', th: 68, pr: 24 },
      { id: 'STU-003', roll: '03', name: 'Pooja Karki', symbol: '27014003A', th: 65, pr: 23 },
      { id: 'STU-004', roll: '04', name: 'Rohan Chaudhary', symbol: '27014004A', th: 58, pr: 22 },
      { id: 'STU-005', roll: '05', name: 'Sneha Gurung', symbol: '27014005A', th: 70, pr: 25 },
      { id: 'STU-006', roll: '06', name: 'Subash Thapa', symbol: '27014006A', th: 62, pr: 21 },
      { id: 'STU-007', roll: '07', name: 'Alina Shakya', symbol: '27014007A', th: 74, pr: 25 },
      { id: 'STU-008', roll: '08', name: 'Kiran KC', symbol: '27014008A', th: 42, pr: 18 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      Sanskaar.renderShell({
        panel: 'school',
        activeNav: 'marks-entry',
        pageTitle: 'Marks Entry Grid',
        breadcrumb: 'Examination',
        rootPrefix: '../'
      });

      renderMarksTable();
    });

    function getGradeInfo(total) {
      if (total >= 90) return { letter: 'A+', gp: '4.0', color: 'text-emerald-600 bg-emerald-50' };
      if (total >= 80) return { letter: 'A', gp: '3.6', color: 'text-emerald-600 bg-emerald-50' };
      if (total >= 70) return { letter: 'B+', gp: '3.2', color: 'text-blue-600 bg-blue-50' };
      if (total >= 60) return { letter: 'B', gp: '2.8', color: 'text-blue-600 bg-blue-50' };
      if (total >= 50) return { letter: 'C+', gp: '2.4', color: 'text-amber-600 bg-amber-50' };
      if (total >= 35) return { letter: 'C', gp: '2.0', color: 'text-amber-600 bg-amber-50' };
      return { letter: 'NG', gp: '0.0', color: 'text-rose-600 bg-rose-50' };
    }

    function renderMarksTable() {
      const tbody = document.getElementById('marks-entry-tbody');
      if (!tbody) return;

      tbody.innerHTML = sampleStudents.map((s, idx) => {
        const total = (s.th || 0) + (s.pr || 0);
        const grade = getGradeInfo(total);

        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-2 px-4 font-bold text-slate-800">#${s.roll}</td>
            <td class="py-2 px-4 font-sans font-bold text-slate-900">${s.name}</td>
            <td class="py-2 px-3 text-slate-600 font-semibold">${s.symbol}</td>
            <td class="py-2 px-3 text-center">
              <input 
                type="number" 
                max="75" 
                min="0" 
                value="${s.th}" 
                oninput="updateRow('${s.id}', this.value, null)"
                class="w-20 px-2 py-1 text-center font-bold bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-[#E8752F]"
              >
            </td>
            <td class="py-2 px-3 text-center">
              <input 
                type="number" 
                max="25" 
                min="0" 
                value="${s.pr}" 
                oninput="updateRow('${s.id}', null, this.value)"
                class="w-20 px-2 py-1 text-center font-bold bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-[#E8752F]"
              >
            </td>
            <td class="py-2 px-3 text-center font-bold text-slate-900" id="tot-${s.id}">${total}</td>
            <td class="py-2 px-3 text-center font-bold text-slate-700" id="gp-${s.id}">${grade.gp}</td>
            <td class="py-2 px-4 text-center">
              <span class="px-2.5 py-0.5 rounded-full font-black text-xs ${grade.color}" id="grd-${s.id}">${grade.letter}</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateRow(id, thVal, prVal) {
      const student = sampleStudents.find(s => s.id === id);
      if (!student) return;

      if (thVal !== null) student.th = Math.min(75, Math.max(0, parseInt(thVal, 10) || 0));
      if (prVal !== null) student.pr = Math.min(25, Math.max(0, parseInt(prVal, 10) || 0));

      const total = student.th + student.pr;
      const grade = getGradeInfo(total);

      document.getElementById(`tot-${id}`).textContent = total;
      document.getElementById(`gp-${id}`).textContent = grade.gp;
      
      const badge = document.getElementById(`grd-${id}`);
      badge.textContent = grade.letter;
      badge.className = `px-2.5 py-0.5 rounded-full font-black text-xs ${grade.color}`;
    }

    function saveMarks() {
      Toast.success('Marks Saved!', 'Term 1 evaluation compiled. Class GPAs recalculated for Class 10-A.');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanskaar ERP - Platform Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="h-full text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
  
  <!-- Ambient background glow -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-[#E8752F]/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar actions -->
  <div class="absolute top-6 left-6 right-6 flex items-center justify-between text-xs text-slate-400">
    <a href="../index.html" class="flex items-center gap-2 hover:text-white transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to Portal Launcher</span>
    </a>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[11px] font-bold">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> SaaS Node Online
      </span>
    </div>
  </div>

  <div class="w-full max-w-md space-y-6 relative z-10">
    
    <!-- Branding Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#E8752F] to-amber-500 text-white font-black text-2xl shadow-lg shadow-orange-500/20 mb-2">
        S
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">Sanskaar ERP Platform</h1>
      <p class="text-xs text-slate-400">Central SaaS Administrator & Tenant Cloud Infrastructure</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="font-bold text-sm text-slate-200">Super Admin Authentication</div>
        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#E8752F]/20 text-[#E8752F] border border-[#E8752F]/30">Level 5 Access</span>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Admin Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
            <input type="email" id="email" value="admin@sanskaar.io" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#E8752F]/30 focus:border-[#E8752F]">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-400 uppercase">Master Password</label>
            <a href="#" onclick="SanskaarToast.show('Password reset token dispatched to superadmin email.', 'info')" class="text-xs text-[#E8752F] hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
            <input type="password" id="password" value="SanskaarAdmin2083#" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#E8752F]/30 focus:border-[#E8752F]">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-[#E8752F] hover:bg-[#d66521] text-white font-bold rounded-xl text-sm shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2">
          <span>Sign In to Platform Admin</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- 1-Click Demo Shortcut -->
      <div class="pt-2 border-t border-slate-800 text-center">
        <button onclick="demoLogin()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-750 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition-all border border-slate-700/60 flex items-center justify-center gap-2">
          <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
          <span>1-Click Demo Admin Sign In</span>
        </button>
        <span class="text-[11px] text-slate-500 block mt-2">Instantly access the SaaS multi-school management dashboard</span>
      </div>
    </div>

    <!-- Portal Switchers -->
    <div class="flex items-center justify-center gap-4 text-xs font-medium text-slate-400">
      <span>Switch Portal:</span>
      <a href="school.html" class="text-slate-300 hover:text-white hover:underline flex items-center gap-1">
        <i data-lucide="building" class="w-3.5 h-3.5"></i> School Panel
      </a>
      <span>•</span>
      <a href="student.html" class="text-slate-300 hover:text-white hover:underline flex items-center gap-1">
        <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i> Student Portal
      </a>
    </div>

  </div>

  <script src="../data/translations.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../assets/js/language.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      SanskaarToast.show('Authenticating Super Admin...', 'info');
      setTimeout(() => {
        window.location.href = '../admin/index.html';
      }, 500);
    }

    function demoLogin() {
      SanskaarToast.show('Logging in as Platform Super Administrator...', 'success');
      setTimeout(() => {
        window.location.href = '../admin/index.html';
      }, 400);
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanskaar ERP - School Staff Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="h-full text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif] flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-100 via-orange-50/30 to-slate-100">
  
  <!-- Top bar actions -->
  <div class="absolute top-6 left-6 right-6 flex items-center justify-between text-xs text-slate-500">
    <a href="../index.html" class="flex items-center gap-2 hover:text-slate-900 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to Portal Launcher</span>
    </a>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Academic Session 2083-84 B.S.
      </span>
    </div>
  </div>

  <div class="w-full max-w-md space-y-6 relative z-10">
    
    <!-- Branding Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#E8752F] text-white font-black text-2xl shadow-lg shadow-orange-500/20 mb-2">
        KV
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Kathmandu Valley Secondary School</h1>
      <p class="text-xs text-slate-500">NEB School Code: 27014 • Faculty & Staff ERP Portal</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl space-y-6">
      
      <!-- Role Quick Select Tabs -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl text-xs font-semibold text-slate-600">
        <button onclick="setRole('principal')" id="btn-principal" class="role-btn flex-1 py-1.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all text-center">Principal</button>
        <button onclick="setRole('teacher')" id="btn-teacher" class="role-btn flex-1 py-1.5 rounded-xl hover:text-slate-900 transition-all text-center">Teacher</button>
        <button onclick="setRole('accountant')" id="btn-accountant" class="role-btn flex-1 py-1.5 rounded-xl hover:text-slate-900 transition-all text-center">Accountant</button>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">School Code</label>
          <div class="relative">
            <i data-lucide="building" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="text" value="KVSS-27014" readonly class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-700 font-semibold focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Staff Email / ID</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="email" id="staff-email" value="dr.thapa@kvss.edu.np" required class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#E8752F]/20 focus:border-[#E8752F]">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-600 uppercase">Password</label>
            <a href="#" onclick="SanskaarToast.show('Contact school IT administrator to reset credentials.', 'info')" class="text-xs text-[#E8752F] hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="password" value="SanskaarKVSS2083" required class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#E8752F]/20 focus:border-[#E8752F]">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-[#E8752F] hover:bg-[#d66521] text-white font-bold rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2">
          <span>Sign In to School ERP</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- 1-Click Demo Shortcut -->
      <div class="pt-2 border-t border-slate-100 text-center">
        <button onclick="demoLogin()" class="w-full py-2.5 bg-orange-50 hover:bg-orange-100 text-[#E8752F] rounded-xl text-xs font-bold transition-all border border-orange-200 flex items-center justify-center gap-2">
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>1-Click Demo Staff Sign In</span>
        </button>
        <span class="text-[11px] text-slate-400 block mt-2">Instantly access the full KVSS School ERP dashboard</span>
      </div>
    </div>

    <!-- Portal Switchers -->
    <div class="flex items-center justify-center gap-4 text-xs font-medium text-slate-500">
      <span>Switch Portal:</span>
      <a href="admin.html" class="text-slate-700 hover:text-slate-900 hover:underline flex items-center gap-1">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin SaaS
      </a>
      <span>•</span>
      <a href="student.html" class="text-slate-700 hover:text-slate-900 hover:underline flex items-center gap-1">
        <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i> Student Portal
      </a>
    </div>

  </div>

  <script src="../data/translations.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../assets/js/language.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script>
    function setRole(role) {
      document.querySelectorAll('.role-btn').forEach(b => {
        b.className = 'role-btn flex-1 py-1.5 rounded-xl hover:text-slate-900 transition-all text-center';
      });
      const active = document.getElementById(`btn-${role}`);
      if (active) active.className = 'role-btn flex-1 py-1.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all text-center font-bold';

      const emailInput = document.getElementById('staff-email');
      if (role === 'principal') emailInput.value = 'dr.thapa@kvss.edu.np';
      if (role === 'teacher') emailInput.value = 'sunita.shrestha@kvss.edu.np';
      if (role === 'accountant') emailInput.value = 'accounts@kvss.edu.np';
    }

    function handleLogin(e) {
      e.preventDefault();
      SanskaarToast.show('Authenticating staff member...', 'info');
      setTimeout(() => {
        window.location.href = '../school/index.html';
      }, 500);
    }

    function demoLogin() {
      SanskaarToast.show('Logging into KVSS School ERP...', 'success');
      setTimeout(() => {
        window.location.href = '../school/index.html';
      }, 400);
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
